# Render Blueprint Specification for Winners Creek / CNC LMS
# Docs: https://render.com/docs/blueprint-spec

services:
  # ============================================================================
  # 1. FastAPI Backend API Service
  # ============================================================================
  - type: web
    name: cnc-api
    runtime: python
    rootDir: apps/api
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: LOG_LEVEL
        value: INFO
      - key: INSTITUTION_TIMEZONE
        value: Asia/Kolkata
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cnc-postgres
          property: connectionString

      # Redis Cache / Queue
      - key: REDIS_URL
        fromService:
          type: redis
          name: cnc-redis
          property: connectionString
      - key: USE_FAKE_REDIS
        value: "false"
      # Security & JWT
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_TTL_DAYS
        value: "7"
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: lax
      - key: ALLOW_DEV_ENDPOINTS
        value: "false"
      # Storage (AWS S3 or Cloudflare R2)
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      # Cross-origin & Public URL
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_WEB_URL
        sync: false
      # Inline worker fallback if dedicated worker service is omitted
      - key: QUEUE_EAGER
        value: "false"

  # ============================================================================
  # 2. Next.js Web Frontend Service
  # ============================================================================
  - type: web
    name: cnc-web
    runtime: node
    rootDir: apps/web
    plan: starter
    buildCommand: npm install && npm run build
    startCommand: npm run start -- -p $PORT
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: 20.18.0
      # Points Next.js server-side API proxy to the FastAPI backend service
      - key: API_PROXY_TARGET
        fromService:
          type: web
          name: cnc-api
          property: host

  # ============================================================================
  # 3. Dedicated Background Queue Worker
  # ============================================================================
  - type: worker
    name: cnc-worker
    runtime: python
    rootDir: apps/api
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python -m app.workers.worker
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENV
        value: production
      - key: USE_POSTGRES
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: cnc-postgres
          property: connectionString

      - key: REDIS_URL
        fromService:
          type: redis
          name: cnc-redis
          property: connectionString
      - key: JWT_SECRET
        sync: false
      - key: STORAGE_DRIVER
        value: s3
      - key: S3_BUCKET
        sync: false
      - key: S3_REGION
        value: ap-south-1
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false

# ==============================================================================
# Managed PostgreSQL Database
# ==============================================================================
databases:
  - name: cnc-postgres
    databaseName: cnc
    user: cnc_user
    plan: starter
    ipAllowList: [] # Allows access from all Render services within the account
